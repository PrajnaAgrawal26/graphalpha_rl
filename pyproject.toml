[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graphalpha"
version = "0.1.0"
description = "Graph-aware symbolic alpha mining with reinforcement learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "gymnasium==0.29.1",
    "stable-baselines3==2.3.2",
    "sb3-contrib==2.3.0",
    "baostock>=0.8.9",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "pytest>=7.4",
]

[tool.setuptools.packages.find]
include = ["graphalpha*"]
